name: Semgrep

on:
  push:
  pull_request:

jobs:
  semgrep:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer Semgrep
        run: pip install semgrep==1.185.0

      - name: Trouver le commit de reference
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "BASE=${{ github.event.pull_request.base.sha }}" >> $GITHUB_ENV
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "BASE=$(git rev-parse HEAD~1)" >> $GITHUB_ENV
          else
            echo "BASE=${{ github.event.before }}" >> $GITHUB_ENV
          fi

      - name: Lancer Semgrep
        run: |
          echo "On compare avec le commit $BASE"
          semgrep scan --config p/java --config p/security-audit --metrics=off --baseline-commit $BASE --error --json-output=semgrep.json tika-core tika-serialization tika-parsers/tika-parsers-standard/tika-parsers-standard-modules/tika-parser-pdf-module tika-parsers/tika-parsers-standard/tika-parsers-standard-modules/tika-parser-ocr-module tika-parsers/tika-parsers-standard/tika-parsers-standard-modules/tika-parser-microsoft-module

      - name: Sauvegarder le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-semgrep
          path: semgrep.json
